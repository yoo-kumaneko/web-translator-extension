<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 1rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      color: #333;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0056b3, #d10056);
      border-radius: 8px;
    }

    h2 {
      margin: 0;
      font-size: 1.25rem;
      background: linear-gradient(135deg, #0056b3, #d10056);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #translateBtn {
      background: #0056b3;
      color: white;
    }

    #translateBtn:hover {
      background: #004494;
    }

    #stopBtn {
      background: #f1f3f5;
      color: #495057;
      border: 1px solid #dee2e6;
    }

    #stopBtn:hover {
      background: #e9ecef;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      font-size: 0.8rem;
      text-align: center;
      color: #28a745;
      display: none;
    }

    .metrics {
      margin-top: 5px;
      font-size: 0.7rem;
      text-align: center;
      color: #6c757d;
      display: none;
    }

    .settings-toggle {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #666;
      cursor: pointer;
      text-decoration: underline;
      text-align: center;
    }

    .settings-panel {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #dee2e6;
    }

    .settings-panel label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 5px;
      color: #495057;
    }

    .settings-panel input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      margin-bottom: 5px;
      box-sizing: border-box;
    }

    .api-help {
      font-size: 0.7rem;
      text-align: right;
    }

    .api-help a {
      color: #0056b3;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo"></div>
    <h2>Article Translator</h2>
  </div>
  <p>Translate news articles from English to Chinese side-by-side.</p>
  <div class="actions">
    <button id="translateBtn">Translate Article</button>
    <button id="stopBtn">Hide Translation</button>
  </div>
  <div id="status" class="status">Translation in progress...</div>
  <div id="metrics" class="metrics"></div>

  <div class="settings-toggle" id="settingsToggle">⚙️ Settings & API Keys</div>
  <div class="settings-panel" id="settingsPanel">
    <label for="provider">Translation Service:</label>
    <select id="provider" style="width: 100%; margin-bottom: 10px; padding: 5px;">
      <option value="google">Google Translate</option>
      <option value="llm">OpenAI Models</option>
      <option value="qwenmt">Qwen Machine Translation (MT)</option>
    </select>

    <div id="googleSettings">
      <label for="googleModel">Google Translate Model:</label>
      <select id="googleModel" style="width: 100%; margin-bottom: 10px; padding: 5px;">
        <option value="legacy">Legacy (Free / Unofficial)</option>
        <option value="official">Official (Paid / API Key required)</option>
      </select>
      
      <label for="apiKey">Google Cloud API Key:</label>
      <input type="password" id="apiKey" placeholder="Leave blank for free tier...">
      
      <label for="googleChunkSize">Max Chunk Size (chars):</label>
      <input type="number" id="googleChunkSize" placeholder="3000" value="3000">

      <div class="api-help">
        <a href="https://cloud.google.com/translate/docs/setup" target="_blank">How to get a key?</a>
      </div>
    </div>

    <div id="llmSettings" style="display: none;">
      <label for="llmEndpoint">Base URL:</label>
      <input type="text" id="llmEndpoint" placeholder="https://api.openai.com/v1">
      <label for="llmApiKey">API Key:</label>
      <input type="password" id="llmApiKey" placeholder="sk-...">
      <label for="llmModel">Model Name:</label>
      <input type="text" id="llmModel" placeholder="gpt-4o-mini">
      
      <label for="llmChunkSize">Max Chunk Size (chars):</label>
      <input type="number" id="llmChunkSize" placeholder="3000" value="3000">
    </div>

    <div id="qwenMtSettings" style="display: none;">
      <label for="qwenMtEndpoint">Base URL:</label>
      <input type="text" id="qwenMtEndpoint" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1">
      <label for="qwenMtApiKey">API Key:</label>
      <input type="password" id="qwenMtApiKey" placeholder="sk-...">
      <label for="qwenMtModel">Model Name:</label>
      <select id="qwenMtModel" style="width: 100%; margin-bottom: 10px; padding: 5px;">
        <option value="qwen-mt-flash">qwen-mt-flash (General Choice)</option>
        <option value="qwen-mt-plus">qwen-mt-plus (Better Quality)</option>
        <option value="qwen-mt-lite">qwen-mt-lite (Fast)</option>
      </select>
      
      <label for="qwenMtChunkSize">Max Chunk Size (chars):</label>
      <input type="number" id="qwenMtChunkSize" placeholder="3000" value="3000">
    </div>

    <button id="saveKeyBtn" 
      style="margin-top: 20px; padding: 8px; font-size: 0.9rem; background: #28a745; color: white;">Save Settings</button>
    <div id="saveStatus"
      style="font-size: 0.75rem; text-align: center; margin-top: 5px; color: #28a745; display: none;">Saved!</div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
